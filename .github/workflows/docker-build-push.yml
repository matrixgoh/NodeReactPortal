name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Default repository path (will be normalized to lowercase by a step before use)
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name to lowercase
        # Ensure IMAGE_NAME is lowercase because Docker registry names must be lowercase
        run: |
          # Lowercase GITHUB_REPOSITORY (owner/repo)
          echo "IMAGE_NAME=$(echo \"$GITHUB_REPOSITORY\" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
        shell: bash

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Use a plain sha tag (no branch prefix) to avoid producing invalid tags
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prepare image tags
        id: image-tags
        # Compute safe tags: when branch exists use 'branch.shortsha', else use 'shortsha'.
        # Also add 'latest' when on the default branch.
        run: |
          set -euo pipefail

          REGISTRY="${{ env.REGISTRY }}"
          IMAGE="${{ env.IMAGE_NAME }}"

          # Short sha
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Derive branch name if present
          BRANCH_NAME=""
          if [[ "${GITHUB_REF}" == refs/heads/* ]]; then
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi

          TAGS=""
          if [[ -n "$BRANCH_NAME" ]]; then
            # Use dot separator between branch and sha (e.g. feature.2437f95)
            TAGS+="$REGISTRY/$IMAGE:${BRANCH_NAME}.${SHORT_SHA}\n"
          fi

          # Always include the short sha tag
          TAGS+="$REGISTRY/$IMAGE:${SHORT_SHA}\n"

          # If this is the default branch, add the 'latest' tag
          if [[ "${GITHUB_REF#refs/heads/}" == "${{ github.event.repository.default_branch }}" || "${GITHUB_REF}" == "refs/heads/${{ github.event.repository.default_branch }}" ]]; then
            TAGS+="$REGISTRY/$IMAGE:latest\n"
          fi

          # Trim trailing newline
          TAGS=$(echo -e "$TAGS" | sed '/^$/d')

          # Set output using the new GitHub Actions output file
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # Use our computed safe tags (branch.shortsha or shortsha, plus latest when appropriate)
          tags: ${{ steps.image-tags.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_TLS_REJECT_UNAUTHORIZED=0

      - name: Run Docker container test
        if: github.event_name != 'pull_request'
        run: |
          # Extract the first tag from the tags we computed and pushed
          IMAGE_TAG=$(echo "${{ steps.image-tags.outputs.tags }}" | head -n 1)
          
          # Pull the image we just pushed
          docker pull "${IMAGE_TAG}"
          
          # Run the container
          docker run -d -p 5000:5000 --name test-container "${IMAGE_TAG}"
          
          # Wait for the container to be healthy with retries
          echo "Waiting for container to be ready..."
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -f http://localhost:5000 >/dev/null 2>&1; then
              echo "✅ Container is responding!"
              break
            fi
            attempt=$((attempt + 1))
            echo "Attempt $attempt/$max_attempts - waiting..."
            sleep 2
          done
          
          # Final check
          if ! curl -f http://localhost:5000 >/dev/null 2>&1; then
            echo "❌ Container failed to start properly"
            docker logs test-container
            exit 1
          fi
          
          # Clean up
          docker stop test-container
          docker rm test-container
          
          echo "✅ Docker container test passed!"

      - name: Output image details
        if: github.event_name != 'pull_request'
        run: |
          echo "### Docker Image Published! 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.image-tags.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pull the image:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run the container:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker run -d -p 5000:5000 ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
